name: PR Validation

on:
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: Helm Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: "4.3.1"

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.2.1 --verify=false

      - name: Lint chart
        run: helm lint .

      - name: Run unit tests
        run: helm unittest .
